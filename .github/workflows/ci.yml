name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Align Json Keys and Update Readme
        shell: pwsh
        run: |
          .\scripts\align-json-keys.ps1
          .\scripts\push-change.ps1 -message "chore: automatically align json keys"
          .\scripts\update-readme.ps1
          .\scripts\push-change.ps1

  sync-gitee:
    name: Sync to Gitee
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/hub-mirror-action@abgox
        with:
          src: github/abgox
          dst: gitee/abgox
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ""
          force_update: true
          static_list: ${{ github.event.repository.name }}

  sync-gitcode:
    name: Sync to GitCode
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/hub-mirror-action@abgox
        with:
          src: github/abgox
          dst: gitcode/abgox
          dst_key: ${{ secrets.GITCODE_SSH_PRIVATE_KEY }}
          dst_token: ""
          force_update: true
          static_list: ${{ github.event.repository.name }}
